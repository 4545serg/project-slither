name: Build PROJECT NOISE

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nintendo 3DS development libraries
        run: |
          dkp-pacman -Syu --noconfirm --needed 3ds-dev

      - name: Download source dependencies
        run: |
          sh tools/get_deps.sh

      - name: Build Nintendo 3DS application
        run: |
          make clean
          make

      - name: Upload 3DSX build
        uses: actions/upload-artifact@v4
        with:
          name: project-noise-3dsx
          path: |
            project_slither.3dsx
            project_slither.smdh
          if-no-files-found: error
